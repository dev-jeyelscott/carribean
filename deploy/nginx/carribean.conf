server {
    listen 80;
    listen [::]:80;

    server_name restaurant.example.com www.restaurant.example.com;

    root /var/www/carribean/public;

    index index.php;
    charset utf-8;

    client_max_body_size 12M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite uses content-hashed filenames, so production assets may be
    # cached aggressively without serving stale application bundles.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        try_files $uri =404;
    }

    # Uploaded restaurant images use shorter public caching because
    # administrators may replace content through Filament.
    location ^~ /storage/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;

        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Prevent directly executing arbitrary PHP files.
    location ~ \.php$ {
        return 404;
    }

    # Allow certificate validation while blocking hidden files.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
